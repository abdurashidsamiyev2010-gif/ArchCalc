<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Flower 3D</title>

<style>
* { margin:0; padding:0; }
body {
  overflow:hidden;
  background:#030509;
}
canvas {
  display:block;
}
</style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050a);
scene.fog = new THREE.FogExp2(0x03050a, 0.035);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth/window.innerHeight, 0.1, 100
);

camera.position.set(0, 2.2, 11);
camera.lookAt(0, 0.7, 0);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.AmbientLight(0x9bbaff, 1.1));

function light(color, intensity, x, y, z) {
  const l = new THREE.PointLight(color, intensity, 20);
  l.position.set(x,y,z);
  scene.add(l);
  return l;
}

light(0xffffff, 90, 0, 4, 4);
light(0x8bdcff, 100, -3, -1, 2);
light(0xffd28a, 75, 3, 2, -2);

// FLOWER GROUP
const flower = new THREE.Group();
flower.position.set(0, 2, 0);
scene.add(flower);

// PETAL GEOMETRY
function createPetal(length, width, bend) {

  const positions = [];
  const indices = [];
  const normals = [];

  const U = 32;
  const V = 16;

  for(let i=0; i<=U; i++) {
    const u = i/U;

    for(let j=0; j<=V; j++) {
      const v = (j/V)*2-1;

      const shape = Math.pow(
        Math.sin(Math.PI*u), 0.75
      );

      const x = v * width * shape;

      const y = u * length;

      const z =
        Math.sin(u*Math.PI)*bend +
        v*v*0.12 +
        Math.abs(v)*0.06*shape;

      positions.push(x,y,z);
    }
  }

  for(let i=0; i<U; i++) {
    for(let j=0; j<V; j++) {

      const a = i*(V+1)+j;
      const b = a+V+1;

      indices.push(a,b,a+1);
      indices.push(b,b+1,a+1);
    }
  }

  const geo = new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions,3)
  );

  geo.setIndex(indices);
  geo.computeVertexNormals();

  return geo;
}

// PETAL MATERIAL
const petalMaterials = [
  new THREE.MeshPhysicalMaterial({
    color:0xf5f4ed,
    metalness:0.05,
    roughness:0.15,
    transmission:0.5,
    thickness:0.8,
    transparent:true,
    opacity:0.88,
    side:THREE.DoubleSide,
    clearcoat:1,
    clearcoatRoughness:0.08,
    emissive:0x5c6175,
    emissiveIntensity:0.18
  }),

  new THREE.MeshPhysicalMaterial({
    color:0xffe8c7,
    roughness:0.22,
    transmission:0.35,
    thickness:0.6,
    transparent:true,
    opacity:0.9,
    side:THREE.DoubleSide,
    clearcoat:1,
    emissive:0x332211,
    emissiveIntensity:0.15
  })
];

// CREATE PETALS
const layers = [
  {count:13, length:2.7, width:0.57, radius:0.15},
  {count:16, length:2.15, width:0.43, radius:0.12},
  {count:19, length:1.55, width:0.32, radius:0.09},
  {count:23, length:0.95, width:0.23, radius:0.05},
  {count:27, length:0.55, width:0.16, radius:0.02}
];

const movingPetals = [];

layers.forEach((layer,index)=>{

  for(let i=0; i<layer.count; i++){

    const angle =
      i/layer.count*Math.PI*2 +
      index*0.23;

    const geo = createPetal(
      layer.length,
      layer.width,
      0.25 + Math.random()*0.25
    );

    const mat = petalMaterials[
      index < 3 ? 0 : 1
    ];

    const mesh = new THREE.Mesh(geo,mat);

    mesh.position.set(
      Math.cos(angle)*layer.radius,
      Math.sin(angle)*layer.radius,
      index*0.045
    );

    mesh.rotation.z = angle-Math.PI/2;

    mesh.rotation.x =
      (Math.random()-0.5)*0.25;

    flower.add(mesh);
    movingPetals.push({
      mesh,
      angle,
      original:mesh.rotation.x,
      phase:Math.random()*6
    });
  }
});

// GOLDEN FLOWER CENTER
const center = new THREE.Mesh(
  new THREE.SphereGeometry(0.34,32,32),
  new THREE.MeshPhysicalMaterial({
    color:0xffe8a5,
    emissive:0xffc76b,
    emissiveIntensity:2.5,
    roughness:0.2
  })
);

flower.add(center);

// GOLDEN FILAMENTS
for(let i=0; i<180; i++){

  const a = Math.random()*Math.PI*2;
  const r = Math.random()*0.35;
  const height = 0.2+Math.random()*0.6;

  const points = [
    new THREE.Vector3(
      Math.cos(a)*r,
      Math.sin(a)*r,
      0
    ),
    new THREE.Vector3(
      Math.cos(a)*r*1.5,
      Math.sin(a)*r*1.5,
      height
    )
  ];

  const geo = new THREE.BufferGeometry()
    .setFromPoints(points);

  const line = new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({
      color:0xffe7b0
    })
  );

  flower.add(line);
}

// STEM
const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(-0.08,-0.8,0),
  new THREE.Vector3(0.1,-1.6,0),
  new THREE.Vector3(0,-2.6,0)
]);

const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve,50,0.055,8,false),
  new THREE.MeshStandardMaterial({
    color:0x315c63,
    roughness:0.4,
    emissive:0x102f45
  })
);

flower.add(stem);

// BLUE ROOT FIBERS
const rootGroup = new THREE.Group();
rootGroup.position.set(0,-0.65,0);
scene.add(rootGroup);

for(let i=0;i<260;i++){

  const angle=Math.random()*Math.PI*2;
  const length=0.4+Math.random()*1.4;

  const start=new THREE.Vector3(0,0,0);

  const middle=new THREE.Vector3(
    Math.cos(angle)*length*0.5,
    -Math.random()*0.35,
    Math.sin(angle)*length*0.5
  );

  const end=new THREE.Vector3(
    Math.cos(angle)*length,
    -Math.random()*0.8,
    Math.sin(angle)*length
  );

  const curve=new THREE.QuadraticBezierCurve3(
    start,middle,end
  );

  const geo=new THREE.BufferGeometry()
    .setFromPoints(curve.getPoints(12));

  const line=new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({
      color:new THREE.Color().setHSL(
        0.52+Math.random()*0.08,
        0.9,
        0.55
      ),
      transparent:true,
      opacity:0.5+Math.random()*0.5
    })
  );

  rootGroup.add(line);
}

// GLOW AT ROOT
const rootGlow=new THREE.PointLight(
  0x32baff,100,5
);

rootGlow.position.set(0,0,0);
rootGroup.add(rootGlow);

// PARTICLES
const particleCount=1800;
const particleGeometry=new THREE.BufferGeometry();
const particlePositions=new Float32Array(
  particleCount*3
);

for(let i=0;i<particleCount;i++){

  particlePositions[i*3]=(Math.random()-0.5)*12;
  particlePositions[i*3+1]=Math.random()*9-3;
  particlePositions[i*3+2]=(Math.random()-0.5)*8;
}

particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(particlePositions,3)
);

const particles=new THREE.Points(
  particleGeometry,
  new THREE.PointsMaterial({
    color:0xdceaff,
    size:0.025,
    transparent:true,
    opacity:0.8
  })
);

scene.add(particles);

// FLOOR
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshPhysicalMaterial({
    color:0x11151c,
    metalness:0.75,
    roughness:0.19,
    clearcoat:1
  })
);

floor.rotation.x=-Math.PI/2;
floor.position.y=-1.95;
scene.add(floor);

// FLOOR GLOW
const floorLight=light(0x367cae,30,0,-1,0);

// ANIMATION
const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  flower.rotation.y=Math.sin(t*0.3)*0.12;

  flower.position.y=
    2+Math.sin(t*0.8)*0.07;

  movingPetals.forEach((p)=>{
    p.mesh.rotation.x=
      p.original+Math.sin(t*0.8+p.phase)*0.025;
  });

  rootGroup.rotation.y=t*0.08;

  particles.rotation.y=t*0.015;

  rootGlow.intensity=90+Math.sin(t*3)*20;

  renderer.render(scene,camera);
}

animate();

// RESPONSIVE
window.addEventListener("resize",()=>{

  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});
</script>

</body>
</html>
